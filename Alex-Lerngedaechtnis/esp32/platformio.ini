[platformio]
src_dir = Lernknoten

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32dev-kontext]
extends = env:esp32dev
build_flags = -DALEX_KONTEXT

[env:esp32dev-erbe]
extends = env:esp32dev
build_flags = -DALEX_ERBE

; UICPAL ESP32-S3-N16R8 (DevKitC-1-Klon), Speicherwerte wie in esp32-s3-audio.
; Serial ist UART0 am COM-Anschluss (CH343-Bruecke), nicht der native USB.
[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Mit CH343 laeuft 230400 sicher durch, 460800 brach beim Waveshare-Board ab.
upload_speed = 230400
; RGB-LED (SK6812) laut Core-Variante DevKitC-1 v1.0 an GPIO48, am Board bestaetigen.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0 -DALEX_RGB_PIN=48

[env:esp32s3-kontext]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DALEX_KONTEXT

[env:esp32s3-erbe]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DALEX_ERBE
