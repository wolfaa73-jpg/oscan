[platformio]
default_envs = guition-c3

; Guition ESP32-2424S012N: ESP32-C3, rundes GC9A01 mit 240 × 240, ohne Touch. Wie ../Gesicht, dazu ein
; LittleFS in der Partition "spiffs" für Gedächtnis und Protokoll.
[env:guition-c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps = lovyan03/LovyanGFX@1.2.29
; CORE_DEBUG_LEVEL=0: Sonst schreibt der Kern bei jeder Frage nach einer fehlenden Datei eine Fehlerzeile
; in denselben Kanal, über den das Protokoll hinausgeht.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DCORE_DEBUG_LEVEL=0 -ffp-contract=off
